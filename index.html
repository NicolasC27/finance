<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#edeff3" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Budget — Suivi personnel</title>
		<!-- No flash on load: the theme (Porcelaine by default) is set on <html> before the bundled CSS.
		     Old values migrate: dark → encre, light → papier. The `light` class stays the structural
		     switch of the light themes (Porcelaine, Papier, Sable). -->
		<script>
			var t = 'porcelaine';
			try {
				var raw = localStorage.getItem('budget:theme');
				if (raw === 'dark') raw = 'encre';
				else if (raw === 'light') raw = 'papier';
				if (['porcelaine', 'porcelaine-nuit', 'encre', 'papier', 'ardoise', 'foret', 'sable'].indexOf(raw) >= 0) t = raw;
			} catch (e) {
				/* localStorage unavailable: the default theme stays */
			}
			document.documentElement.dataset.theme = t;
			document.documentElement.classList.toggle('light', t === 'porcelaine' || t === 'papier' || t === 'sable');
			var bg = { porcelaine: '#edeff3', 'porcelaine-nuit': '#0f131b', encre: '#1c1c1c', papier: '#f7f5f0', ardoise: '#1a1d20', foret: '#171c18', sable: '#f2ede4' };
			document.querySelector('meta[name="theme-color"]').setAttribute('content', bg[t]);
		</script>
		<style>
			/* Background set before the bundled CSS, one rule per theme */
			html {
				background-color: #edeff3;
			}
			html[data-theme='porcelaine-nuit'] {
				background-color: #0f131b;
			}
			html[data-theme='encre'] {
				background-color: #1c1c1c;
			}
			html[data-theme='papier'] {
				background-color: #f7f5f0;
			}
			html[data-theme='ardoise'] {
				background-color: #1a1d20;
			}
			html[data-theme='foret'] {
				background-color: #171c18;
			}
			html[data-theme='sable'] {
				background-color: #f2ede4;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
